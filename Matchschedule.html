
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#001870">
<title>مباريات العالم</title>

<style>
:root {
  --blue: #001870;
  --green: #00FC3C;
  --bg: #f3f5fa;
  --white: #ffffff;
  --text: #151923;
  --muted: #858b9b;
  --border: #e9ecf3;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  padding-bottom: 90px;
}

button, select, input {
  font-family: inherit;
}

.top {
  background: var(--white);
  padding: 17px 16px 12px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 10px #0018700b;
}

.top-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--blue);
  font-size: 20px;
  font-weight: 900;
}

.brand-icon {
  width: 35px;
  height: 35px;
  border-radius: 11px;
  background: var(--blue);
  color: var(--green);
  display: grid;
  place-items: center;
  font-size: 19px;
}

.date-text {
  color: var(--muted);
  font-size: 12px;
  margin-top: 13px;
  font-weight: bold;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-top: 15px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  border: 0;
  border-radius: 22px;
  padding: 9px 17px;
  white-space: nowrap;
  background: #f0f2f7;
  color: #606779;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: var(--blue);
  color: white;
}

.tab.active span {
  color: var(--green);
}

.container {
  padding: 15px 12px;
  max-width: 700px;
  margin: auto;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 15px;
}

.toolbar select {
  background: white;
  border: 1px solid var(--border);
  color: var(--blue);
  border-radius: 10px;
  padding: 10px;
  font-size: 12px;
  font-weight: bold;
  outline: none;
  max-width: 190px;
}

.refresh-btn {
  background: var(--blue);
  color: var(--green);
  border: 0;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.league {
  margin-bottom: 16px;
}

.league-header {
  background: #e4e8f2;
  border-radius: 12px;
  min-height: 45px;
  padding: 9px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.league-name {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--blue);
  font-size: 14px;
  font-weight: 900;
}

.league-logo {
  width: 23px;
  height: 23px;
  object-fit: contain;
}

.league-more {
  color: #858b9b;
  font-size: 19px;
  letter-spacing: 2px;
}

.match {
  background: white;
  border: 1px solid #edf0f5;
  border-radius: 15px;
  min-height: 91px;
  margin-bottom: 9px;
  padding: 12px 10px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr);
  align-items: center;
  gap: 5px;
  box-shadow: 0 2px 7px #00187005;
}

.team {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.team.home {
  justify-content: flex-start;
}

.team.away {
  justify-content: flex-end;
}

.team-logo {
  width: 33px;
  height: 33px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-name {
  font-size: 13px;
  font-weight: bold;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.center {
  text-align: center;
}

.match-time {
  background: #f5f7fb;
  border-radius: 25px;
  padding: 8px 3px;
  color: var(--blue);
  font-size: 13px;
  font-weight: 900;
  white-space: nowrap;
}

.match-status {
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
  font-weight: bold;
}

.match-status.live {
  color: #e32942;
}

.match-status.finished {
  color: #777;
}

.watch-btn {
  display: inline-block;
  background: var(--blue);
  color: var(--green);
  border: 0;
  border-radius: 7px;
  font-size: 10px;
  font-weight: bold;
  padding: 6px 9px;
  margin-top: 5px;
  text-decoration: none;
}

.add-link {
  display: block;
  margin: 5px auto 0;
  border: 0;
  background: transparent;
  color: #9298a7;
  font-size: 10px;
  cursor: pointer;
}

.score {
  color: var(--blue);
  font-size: 19px;
  font-weight: 900;
  direction: ltr;
}

.empty {
  background: white;
  border-radius: 14px;
  padding: 35px 15px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  line-height: 2;
}

.loading {
  text-align: center;
  padding: 40px 10px;
  color: var(--blue);
  font-weight: bold;
}

.loading span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 8px;
}

.error {
  background: #fff0f0;
  color: #c62828;
  border-radius: 12px;
  padding: 15px;
  font-size: 12px;
  line-height: 1.8;
  margin-bottom: 15px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  right: 0;
  left: 0;
  height: 76px;
  background: white;
  box-shadow: 0 -3px 15px #00187012;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 20;
  padding-bottom: 5px;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  color: #9298a7;
  font-size: 10px;
  font-weight: bold;
  background: none;
  border: 0;
  cursor: pointer;
}

.nav-icon {
  font-size: 23px;
  line-height: 1;
}

.nav-item.active {
  color: var(--blue);
}

.nav-item.active .nav-icon {
  color: var(--green);
}

.modal-bg {
  position: fixed;
  inset: 0;
  background: #0008;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal {
  width: 100%;
  max-width: 380px;
  background: white;
  border-radius: 17px;
  padding: 20px;
}

.modal h3 {
  color: var(--blue);
  margin-bottom: 15px;
  font-size: 16px;
}

.modal input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px;
  margin-bottom: 10px;
  outline: none;
  direction: ltr;
  text-align: left;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 5px;
}

.modal-actions button {
  flex: 1;
  border: 0;
  border-radius: 9px;
  padding: 11px;
  font-weight: bold;
  cursor: pointer;
}

.save-btn {
  background: var(--blue);
  color: var(--green);
}

.cancel-btn {
  background: #edf0f5;
  color: #555;
}

.note {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.7;
  margin-top: 12px;
}

@media (max-width: 370px) {
  .match {
    grid-template-columns: minmax(0, 1fr) 78px minmax(0, 1fr);
    padding: 10px 7px;
  }

  .team-name {
    font-size: 11px;
  }

  .team-logo {
    width: 28px;
    height: 28px;
  }

  .match-time {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="top-line">
    <div class="brand">
      <div class="brand-icon">⚽</div>
      <span>مباريات العالم</span>
    </div>
    <button class="refresh-btn" onclick="loadMatches()">⟳ تحديث</button>
  </div>

  <div class="date-text" id="dateText">جاري تحميل التاريخ...</div>

  <div class="tabs">
    <button class="tab active" data-filter="all" onclick="setFilter('all',this)">الكل</button>
    <button class="tab" data-filter="live" onclick="setFilter('live',this)">مباشر <span id="liveCount">0</span></button>
    <button class="tab" data-filter="upcoming" onclick="setFilter('upcoming',this)">القادمة</button>
    <button class="tab" data-filter="finished" onclick="setFilter('finished',this)">المنتهية</button>
  </div>
</header>

<main class="container">
  <div class="toolbar">
    <select id="leagueSelect" onchange="renderMatches()">
      <option value="all">جميع البطولات</option>
    </select>
    <span id="lastUpdate" style="font-size:10px;color:#858b9b"></span>
  </div>

  <div id="matches">
    <div class="loading">جاري تحميل المباريات...<span>يرجى الانتظار</span></div>
  </div>
</main>

<nav class="bottom-nav">
  <button class="nav-item">
    <span class="nav-icon">•••</span>
    <span>المزيد</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">▥</span>
    <span>الترتيب</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">🏆</span>
    <span>المسابقة</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">▤</span>
    <span>الأخبار</span>
  </button>
  <button class="nav-item active">
    <span class="nav-icon">⚽</span>
    <span>المباريات</span>
  </button>
</nav>

<div class="modal-bg" id="linkModal">
  <div class="modal">
    <h3>إضافة رابط مشاهدة</h3>
    <input id="matchIdInput" type="text" placeholder="رقم المباراة">
    <input id="streamUrlInput" type="url" placeholder="https://example.com/player">
    <div class="modal-actions">
      <button class="save-btn" onclick="saveStreamLink()">حفظ الرابط</button>
      <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
    </div>
    <p class="note">يتم حفظ الروابط على هذا الجهاز والمتصفح فقط، ولا تظهر تلقائياً للزوار الآخرين.</p>
  </div>
</div>

<script>
/* ضع مفتاح API الجديد هنا */
const API_KEY = "d7cb1fa1e549aa0fbeb2ac61b3b9ecde";

const API_URL = "https://v3.football.api-sports.io";

const leagues = [
  { id: 39, name: "الدوري الإنجليزي الممتاز" },
  { id: 140, name: "الدوري الإسباني" },
  { id: 135, name: "الدوري الإيطالي" },
  { id: 78, name: "الدوري الألماني" },
  { id: 61, name: "الدوري الفرنسي" },
  { id: 307, name: "الدوري السعودي" },
  { id: 233, name: "الدوري المصري" },
  { id: 2, name: "دوري أبطال أوروبا" },
  { id: 12, name: "دوري أبطال أفريقيا" }
];

let allMatches = [];
let currentFilter = "all";

let streamLinks = {};
try {
  streamLinks = JSON.parse(localStorage.getItem("worldFootballLinks") || "{}");
} catch (e) {
  streamLinks = {};
}

const liveStatuses = ["1H", "HT", "2H", "ET", "BT", "P", "LIVE", "INT"];
const finishedStatuses = ["FT", "AET", "PEN"];
const upcomingStatuses = ["NS", "TBD"];

function iraqDate() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Baghdad",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

function updateDate() {
  const now = new Date();
  document.getElementById("dateText").textContent =
    new Intl.DateTimeFormat("ar-IQ", {
      timeZone: "Asia/Baghdad",
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }).format(now);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function formatTime(date) {
  return new Intl.DateTimeFormat("ar-IQ", {
    timeZone: "Asia/Baghdad",
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  }).format(new Date(date));
}

function getStatus(match) {
  const status = match.fixture.status.short;

  if (liveStatuses.includes(status)) return "live";
  if (finishedStatuses.includes(status)) return "finished";
  return "upcoming";
}

function statusText(match) {
  const status = match.fixture.status.short;

  if (liveStatuses.includes(status)) {
    return match.fixture.status.elapsed
      ? `مباشر ${match.fixture.status.elapsed}'`
      : "مباشر";
  }

  if (finishedStatuses.includes(status)) return "انتهت المباراة";
  if (status === "PST") return "مؤجلة";
  if (status === "CANC") return "ملغاة";

  return "لم تبدأ";
}

async function loadMatches() {
  if (!API_KEY || API_KEY === "YOUR_NEW_API_KEY") {
    document.getElementById("matches").innerHTML =
      '<div class="error">أضف مفتاح API الجديد داخل الكود في خانة API_KEY حتى تظهر المباريات.</div>';
    return;
  }

  document.getElementById("matches").innerHTML =
    '<div class="loading">جاري تحميل المباريات...<span>قد يستغرق ذلك بضع ثوانٍ</span></div>';

  try {
    const date = iraqDate();

    const response = await fetch(
      `${API_URL}/fixtures?date=${date}&timezone=Asia/Baghdad`,
      {
        headers: {
          "x-apisports-key": API_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (data.errors && Object.keys(data.errors).length) {
      throw new Error(JSON.stringify(data.errors));
    }

    const allowedLeagues = leagues.map(item => item.id);

    allMatches = (data.response || []).filter(match =>
      allowedLeagues.includes(match.league.id)
    );

    document.getElementById("lastUpdate").textContent =
      "آخر تحديث: " + formatTime(new Date());

    updateDate();
    updateLiveCount();
    renderMatches();

  } catch (error) {
    document.getElementById("matches").innerHTML =
      `<div class="error">تعذر تحميل المباريات.<br>${escapeHTML(error.message)}<br>تحقق من مفتاح API واتصال الإنترنت.</div>`;
  }
}

function updateLiveCount() {
  const count = allMatches.filter(match =>
    getStatus(match) === "live"
  ).length;

  document.getElementById("liveCount").textContent = count;
}

function setFilter(filter, button) {
  currentFilter = filter;

  document.querySelectorAll(".tab").forEach(tab =>
    tab.classList.remove("active")
  );

  button.classList.add("active");
  renderMatches();
}

function renderMatches() {
  const container = document.getElementById("matches");
  const selectedLeague = document.getElementById("leagueSelect").value;

  let matches = allMatches.filter(match => {
    const status = getStatus(match);

    const filterMatch =
      currentFilter === "all" ||
      status === currentFilter;

    const leagueMatch =
      selectedLeague === "all" ||
      String(match.league.id) === selectedLeague;

    return filterMatch && leagueMatch;
  });

  if (!matches.length) {
    container.innerHTML =
      '<div class="empty">لا توجد مباريات ضمن هذا الاختيار حالياً ⚽</div>';
    return;
  }

  const groups = {};

  matches.forEach(match => {
    const leagueId = match.league.id;

    if (!groups[leagueId]) {
      groups[leagueId] = {
        league: match.league,
        matches: []
      };
    }

    groups[leagueId].matches.push(match);
  });

  let html = "";

  Object.values(groups).forEach(group => {
    html += `
      <section class="league">
        <div class="league-header">
          <div class="league-name">
            <img class="league-logo"
              src="${escapeHTML(group.league.logo)}"
              onerror="this.style.display='none'">
            <span>${escapeHTML(group.league.name)}</span>
          </div>
          <span class="league-more">•••</span>
        </div>
    `;

    group.matches.forEach(match => {
      html += renderMatch(match);
    });

    html += "</section>";
  });

  container.innerHTML = html;
}

function renderMatch(match) {
  const home = match.teams.home;
  const away = match.teams.away;
  const status = getStatus(match);
  const finishedOrLive = status === "live" || status === "finished";

  const homeScore = match.goals.home ?? "-";
  const awayScore = match.goals.away ?? "-";

  const link = streamLinks[String(match.fixture.id)];

  let centerHTML = "";

  if (finishedOrLive) {
    centerHTML = `
      <div class="score">${homeScore} - ${awayScore}</div>
      <div class="match-status ${status === "live" ? "live" : "finished"}">
        ${escapeHTML(statusText(match))}
      </div>
    `;
  } else {
    centerHTML = `
      <div class="match-time">${escapeHTML(formatTime(match.fixture.date))}</div>
      <div class="match-status">${escapeHTML(statusText(match))}</div>
    `;
  }

  let watchHTML = "";

  if (link && isValidUrl(link)) {
    watchHTML = `
      <a class="watch-btn"
         href="${escapeHTML(link)}"
         target="_blank"
         rel="noopener noreferrer">مشاهدة المباراة</a>
    `;
  }

  return `
    <article class="match">
      <div class="team home">
        <img class="team-logo"
          src="${escapeHTML(home.logo)}"
          alt=""
          onerror="this.style.display='none'">
        <span class="team-name">${escapeHTML(home.name)}</span>
      </div>

      <div class="center">
        ${centerHTML}
        ${watchHTML}
        <button class="add-link"
          onclick="openModal('${match.fixture.id}')">
          ${link ? "تعديل رابط المشاهدة" : "إضافة رابط مشاهدة"}
        </button>
      </div>

      <div class="team away">
        <span class="team-name">${escapeHTML(away.name)}</span>
        <img class="team-logo"
          src="${escapeHTML(away.logo)}"
          alt=""
          onerror="this.style.display='none'">
      </div>
    </article>
  `;
}

function isValidUrl(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" || url.protocol === "http:";
  } catch (e) {
    return false;
  }
}

function openModal(id) {
  document.getElementById("matchIdInput").value = id;
  document.getElementById("streamUrlInput").value =
    streamLinks[String(id)] || "";

  document.getElementById("linkModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("linkModal").style.display = "none";
}

function saveStreamLink() {
  const id = document.getElementById("matchIdInput").value.trim();
  const url = document.getElementById("streamUrlInput").value.trim();

  if (!id) {
    alert("رقم المباراة غير موجود");
    return;
  }

  if (!isValidUrl(url)) {
    alert("أدخل رابطاً صحيحاً يبدأ بـ https:// أو http://");
    return;
  }

  streamLinks[id] = url;
  localStorage.setItem("worldFootballLinks", JSON.stringify(streamLinks));

  closeModal();
  renderMatches();
}

function fillLeagueSelect() {
  const select = document.getElementById("leagueSelect");

  leagues.forEach(league => {
    const option = document.createElement("option");
    option.value = league.id;
    option.textContent = league.name;
    select.appendChild(option);
  });
}

fillLeagueSelect();
updateDate();
loadMatches();

setInterval(loadMatches, 60000);
</script>

</body>
</html>
