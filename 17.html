
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Beta TV</title>

<link rel="stylesheet" href="https://www.high-kora.com/TOD/WEB/new.css">
<script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

.video-container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}

#player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* الشعار أسفل اليمين */
#overlay-logo {
  position: fixed;
  bottom: 30px;
  right: 15px;
  top: auto;
  width: 60px;
  height: auto;
  z-index: 2147483647;
  opacity: 0.85;
  pointer-events: none;
  display: block !important;
  visibility: visible !important;
}

.error-message {
  font-size: 20px;
  font-weight: bold;
  color: red;
  display: none;
  z-index: 100;
}

/* وضع ملء الشاشة */
.video-container:fullscreen {
  width: 100%;
  height: 100%;
  background: #000;
}

.video-container:-webkit-full-screen {
  width: 100%;
  height: 100%;
  background: #000;
}
</style>
</head>

<body>

<img
  id="overlay-logo"
  src="https://i.ibb.co/Cp1yXqYr/IMG-0991.png"
  alt="Ali Thamer"
>

<div class="video-container" id="videoContainer">
  <div id="player"></div>
  <div class="error-message" id="errorMessage">لا يوجد بث حاليًا</div>
</div>

<script>
jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';

document.addEventListener("DOMContentLoaded", function () {

  const container = document.getElementById("videoContainer");
  const logo = document.getElementById("overlay-logo");

  var player = jwplayer("player").setup({
    playlist: [{
      sources: [{
        type: "hls",
        file: "https://kwtspta.cdn.mangomolo.com/sp/smil:sp.stream.smil/chunklist.m3u8"
      }]
    }],
    width: "100%",
    height: "100%",
    aspectratio: "16:9",
    autostart: true,
    controls: true,
    mute: false,
    volume: 100,
    stretching: "uniform",
    cast: {},
    sharing: {},
    playbackRateControls: true,
    playbackRates: [0.5, 1, 1.25, 1.5, 2]
  });

  // ==================================
  // ملء الشاشة التلقائي
  // ==================================

  async function openFullscreen() {
    if (
      document.fullscreenElement ||
      document.webkitFullscreenElement
    ) return;

    try {
      if (container.requestFullscreen) {
        await container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      }
    } catch (error) {
      console.log("Fullscreen requires user interaction");
    }
  }

  // المحاولة فور تحميل الصفحة
  openFullscreen();

  window.addEventListener("load", function () {
    setTimeout(openFullscreen, 300);
  });

  // المحاولة عند أول تفاعل
  function firstInteraction() {
    openFullscreen();
  }

  document.addEventListener("touchstart", firstInteraction, {
    once: true,
    passive: true
  });

  document.addEventListener("click", firstInteraction, {
    once: true
  });

  // ==================================
  // تثبيت الشعار أسفل الشاشة
  // ==================================

  function moveLogo() {
    const fsElement =
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement;

    if (fsElement) {
      if (!fsElement.contains(logo)) {
        fsElement.appendChild(logo);
      }
    } else {
      if (logo.parentElement !== document.body) {
        document.body.appendChild(logo);
      }
    }

    logo.style.position = "fixed";
    logo.style.bottom = "30px";
    logo.style.top = "auto";
    logo.style.right = "15px";
    logo.style.width = "60px";
    logo.style.height = "auto";
    logo.style.zIndex = "2147483647";
    logo.style.display = "block";
    logo.style.visibility = "visible";
    logo.style.opacity = "0.85";
    logo.style.pointerEvents = "none";
  }

  document.addEventListener("fullscreenchange", moveLogo);
  document.addEventListener("webkitfullscreenchange", moveLogo);
  document.addEventListener("mozfullscreenchange", moveLogo);

  player.on("fullscreen", function () {
    setTimeout(moveLogo, 100);
  });

  setInterval(moveLogo, 1000);

  // ==================================
  // زر تغيير حجم الصورة
  // ==================================

  let isExpanded = false;

  const expandSvg = `<svg fill="#ffffff" xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 0 100 100">
  <g>
  <path d="M22.661,20.5H36c1.104,0,2-0.896,2-2s-0.896-2-2-2H19c-1.104,0-2.5,1.276-2.5,2.381v17c0,1.104,0.896,2,2,2s2-0.896,2-2V24.876l16.042,15.791c0.391,0.391,1.027,0.586,1.539,0.586s1.086-0.195,1.477-0.586c0.781-0.781,0.812-2.237,0.031-3.019L22.661,20.5z"></path>
  <path d="M83,16.5H66c-1.104,0-2,0.896-2,2s0.896,2,2,2h12.605L61.647,37.648c-0.781,0.781-0.781,2.142,0,2.923c0.39,0.391,0.902,0.633,1.414,0.633s0.774-.171,1.164-.562l16.274-16.5v11.738c0,1.104.896,2,2,2s2-.896,2-2v-17C84.5,17.776,84.104,16.5,83,16.5z"></path>
  <path d="M36.542,60.962L20.5,76.754V65.881c0-1.104-.896-2-2-2s-2,.896-2,2v17c0,1.104,1.396,1.619,2.5,1.619h17c1.104,0,2-.896,2-2s-.896-2-2-2H22.529L39.62,63.6c.781-.781.656-1.951-.125-2.732C38.715,60.086,37.322,60.181,36.542,60.962z"></path>
  <path d="M82.5,63.881c-1.104,0-2,.896-2,2v11.606L64.226,60.962c-.78-.781-1.923-.781-2.703,0-.781.781-.719 1.856.062 2.638l17.152 16.9H66c-1.104 0-2 .896-2 2s.896 2 2 2h17c1.104 0 1.5-.515 1.5-1.619v-17c0-1.104-.896-2-2-2z"></path>
  </g></svg>`;

  player.addButton(
    expandSvg,
    "تكبير/تصغير",
    function () {
      const video = document.querySelector(".jwplayer video");
      if (!video) return;

      video.style.objectFit = isExpanded ? "contain" : "fill";
      isExpanded = !isExpanded;
    },
    "expandButton"
  );

  player.on("ready", function () {
    console.log("تم تحميل المشغل بنجاح");
    moveLogo();
  });

  // تعطيل قائمة الزر الأيمن
  document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
  });

  // تعطيل بعض اختصارات النسخ
  document.addEventListener("keydown", function(e) {
    if (
      e.ctrlKey &&
      ["KeyC", "KeyX", "KeyS", "KeyU"].includes(e.code)
    ) {
      e.preventDefault();
    }
  });

});
</script>

</body>
</html>
